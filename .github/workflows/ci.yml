name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip
          - name: macOS
            os: macos-15
            pluginval: pluginval_macOS.zip
          - name: Windows
            os: windows-2022
            pluginval: pluginval_Windows.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libcurl4-openssl-dev \
            libfontconfig1-dev libfreetype-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          elif [ "$RUNNER_OS" == "Linux" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Fetch pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval }}"
          unzip -q pluginval.zip -d pluginval

      - name: Validate VST3 (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./pluginval/pluginval --strictness-level 10 --skip-gui-tests --validate-in-process --validate "build/plugin/ZeroDrum_artefacts/Release/VST3/Zero Drum.vst3"

      - name: Validate VST3 and AU (macOS)
        if: runner.os == 'macOS'
        run: |
          PV=./pluginval/pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --skip-gui-tests --validate-in-process --validate "build/plugin/ZeroDrum_artefacts/Release/VST3/Zero Drum.vst3"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/plugin/ZeroDrum_artefacts/Release/AU/Zero Drum.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i "Zero Drum" || true
          auval -strict -v aumu ZrDm Bspt

      - name: Validate VST3 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./pluginval/pluginval.exe --strictness-level 10 --skip-gui-tests --validate-in-process --validate "build/plugin/ZeroDrum_artefacts/Release/VST3/Zero Drum.vst3"

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: ZeroDrum-${{ runner.os }}
          path: |
            build/plugin/ZeroDrum_artefacts/Release/CLAP
            build/plugin/ZeroDrum_artefacts/Release/VST3
            build/plugin/ZeroDrum_artefacts/Release/AU
            build/plugin/ZeroDrum_artefacts/Release/Standalone
          if-no-files-found: warn
          retention-days: 14
